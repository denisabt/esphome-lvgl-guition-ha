sensor:
  # Header Office Temperate
  - platform: homeassistant
    entity_id: sensor.office_4_awtrix_led_matrix_temperature
    id: office_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures
          text:
            format: "%d° / %d°"
            args: ["(int)round(id(outdoor_temperature).state)", "(int)round(x)"]

  - platform: homeassistant
    entity_id: sensor.hochbeet_sud_soil_temperature_soil_sensor
    id: outdoor_temperature
    on_value:
      - lvgl.label.update:
          id: temperatures
          text:
            format: "%d° / %d°"
            args: ["(int)round(x)", "(int)round(id(office_temperature).state)"]

  # Claude generated sensors from my own homeassistant instance
