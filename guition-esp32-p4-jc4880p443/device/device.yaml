# Designed for guition-esp32-p4-jc4880p443
esp32:
  variant: esp32p4
  flash_size: 16MB
  engineering_sample: true
  framework:
    type: esp-idf
    advanced:
      enable_idf_experimental_features: yes

# Esphome
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  area: ${room}

# Secondary ESP32-C6 device for connectivity
esp32_hosted:
  active_high: true
  variant: ESP32C6
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17

# Video memory
psram:
  speed: 200MHz

# Over the Air Updates
ota:
  platform: esphome

# Enable Home Assistant API
api:

# Enable logging
logger:

# Power management
esp_ldo:
  - channel: 3
    voltage: 2.5V

# Backlight
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO23
    frequency: 100Hz
    inverted: false
    min_power: 0.0
    max_power: 0.8

light:
  - platform: monochromatic
    output: backlight_output
    name: Screen
    icon: mdi:television
    entity_category: config
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

number:
  - platform: template
    name: LVGL Screen timeout
    optimistic: true
    id: display_timeout
    unit_of_measurement: "s"
    initial_value: 45
    restore_value: true
    min_value: 10
    max_value: 180
    step: 5
    mode: box

# I2C
i2c:
  sda: GPIO7
  scl: GPIO8
  scan: false
  frequency: 400kHz

# Touchscreen
touchscreen:
  - platform: gt911
    id: my_touchscreen
    display: my_display
    on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - light.turn_on: display_backlight
              - lvgl.resume:
              - lvgl.widget.redraw:

# Display
display:
  - platform: mipi_dsi
    id: my_display
    model: JC4880P443

font:
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_20
    size: 20
    bpp: 4
    glyphs: ["\U000F02DC", "\U000F0335", "\U000F06B5", "\U000F075A", "\U000F040A", "\U000F03E4", "\U000F040E", "\U000F04AD", "\U000F04AE", "\U000F057E", "\U000F00ED", "\U000F0004", "\U000F0595", "\U000F0597", "\U000F059A", "\U000F05A8", "\U000F04B2", "\U000F0502", "\U000F02E3", "\U000F0425", "\U000F0D91", "\U000F050F", "\U000F04C3", "\U000F0439"]
  - file:
      type: web
      url: https://raw.githubusercontent.com/Templarian/MaterialDesign-Webfont/v7.4.47/fonts/materialdesignicons-webfont.ttf
    id: mdi_28
    size: 28
    bpp: 4
    glyphs: ["\U000F02DC", "\U000F0335", "\U000F06B5", "\U000F075A", "\U000F040A", "\U000F03E4", "\U000F040E", "\U000F04AD", "\U000F04AE", "\U000F057E", "\U000F00ED", "\U000F0004", "\U000F0595", "\U000F0597", "\U000F059A", "\U000F05A8", "\U000F04B2", "\U000F0502", "\U000F02E3", "\U000F0425", "\U000F0D91", "\U000F050F", "\U000F04C3", "\U000F0439"]
  - file: &cover_icon_font "../assets/shutter-icons.ttf"   # "https://github.com/alaltitov/Guition-ESP32-S3-4848S040/blob/dev/src/fonts/icons_v2.ttf"
    id: shutter_font_icon
    size: 150
    bpp: 4 

image:
- platform: file
  file: "./../assets/back6.png"
  type: BINARY
  id: back_6
